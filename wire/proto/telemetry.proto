// Protobuf wire schema for the NetTact agent <-> server WebSocket channel
// (architecture 5.1 / 15.2-3). Every message on the socket is one Frame
// (a oneof envelope), encoded per the negotiated WS subprotocol — protobuf
// (nettact.v1.protobuf) or JSON (nettact.v1.json). The canonical in-memory
// types remain the hand-written Go structs in protocol/telemetry and
// protocol/config.
//
// Field numbers follow the current struct field order and MUST NOT be reused or
// renumbered once shipped. Open string enums (kind, type, severity, layer, op)
// stay `string` on the wire so unknown values are tolerated, matching the JSON
// contract. Message-typed fields are optional: absence == the Go nil pointer.
syntax = "proto3";

package nettact.wire.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nettact/protocol/wire/pb;pb";

// Hello is the first frame an agent sends after the WebSocket upgrade. It
// replaces the per-request X-Agent-* headers of the old POST transport and
// carries the config watermark so the server knows what to push on connect.
// Field 5 (capabilities) was removed when the flat capability list became the
// three-view PermissionReport and is reserved.
message Hello {
  reserved 5;
  reserved "capabilities";
  int32 schema_version = 1;
  string hostname = 2;
  string platform = 3;
  string agent_version = 4;
  int32 reported_config_version = 6;
  PermissionReport permissions = 7;
}

// PermissionReport mirrors permission.PermissionReport — the agent's
// authoritative supported/granted/effective permission views plus policy source
// and hash. Carried by both Hello and (at enrollment) the HTTP EnrollRequest.
message PermissionReport {
  repeated string supported = 1;
  repeated string granted = 2;
  repeated string effective = 3;
  string source = 4;
  string policy_hash = 5;
}

// MonitorStatus mirrors wire.MonitorStatus — the agent's full-state evaluation
// of every pushed monitor for one ConfigVersion.
message MonitorStatus {
  int32 config_version = 1;
  string policy_hash = 2;
  repeated MonitorStatusEntry statuses = 3;
  // Agent's WAL batch-upload interval (its global telemetry flush cadence, not a
  // per-monitor value). The server folds it into the freshness window (rounded up
  // to whole seconds) so the probe->arrival batching/drain/ingest latency is not
  // mistaken for a stale sample.
  int32 upload_interval_seconds = 4;
}

// MonitorStatusEntry mirrors wire.MonitorStatusEntry.
message MonitorStatusEntry {
  string monitor_id = 1;
  string status = 2; // active | permission_blocked | target_blocked | unsupported
  repeated string missing_permissions = 3;
  string matched_selector = 4;
  string reason = 5;
  // Agent's actual effective per-target schedule for this monitor, so the server
  // derives freshness from what the agent really runs (which the agent-local
  // MinProbeInterval floor can raise well above the configured/default interval).
  int32 effective_interval_seconds = 6;
  int32 cycle_deadline_ms = 7;
  // The ProbeTarget.config_serial the agent actually applied for this monitor —
  // the per-target material generation echoed back so the server can distinguish
  // a report for the current generation from a stale/obsolete one.
  int32 target_config_serial = 8;
}

// Frame is the envelope for every message on the agent <-> server WebSocket.
// Exactly one field is set.
message Frame {
  oneof msg {
    // agent -> server
    Hello hello = 1;
    Packet packet = 2;
    HostSnapshot host_snapshot = 3;
    MonitorStatus monitor_status = 7;
    IncidentSnapshot incident_snapshot = 10;
    TraceResult trace_result = 11;
    // server -> agent
    TelemetryAck ack = 4;
    DesiredState desired_state = 5;
    SnapshotRequest snapshot_request = 6;
    IncidentSnapshotRequest incident_snapshot_request = 8;
    TraceRequest trace_request = 9;
  }
}

// Packet mirrors telemetry.Packet — one batched, idempotent upload. Field 10
// (host_snapshot) was removed when HostSnapshot became its own Frame variant
// and is reserved so the number/name can never be silently reused.
message Packet {
  reserved 10;
  reserved "host_snapshot";
  int32 schema_version = 1;
  string agent_id = 2;
  string site_id = 3;
  uint64 sequence = 4;
  google.protobuf.Timestamp sent_at = 5;
  repeated Metric metrics = 6;
  repeated Event events = 7;
  repeated InventoryItem inventory_delta = 8;
  int32 reported_config_version = 9;
  repeated InterfaceSnapshot interface_snapshots = 11;
}

// Metric mirrors telemetry.Metric.
message Metric {
  google.protobuf.Timestamp ts = 1;
  string kind = 2; // open enum (telemetry.MetricKind)
  string target = 3;
  string layer = 4; // open enum (telemetry.HealthLayer)
  double value = 5;
  string unit = 6;
  map<string, string> labels = 7;
  // The user-created monitor (probe task) that produced this sample. Empty for
  // system metrics (host.*, iface.up, agent.*).
  string monitor_id = 8;
  // The probe target's material config generation (probe_tasks.config_serial)
  // this sample was produced under. 0 for system metrics (monitor_id == "").
  int32 config_serial = 9;
}

// Event mirrors telemetry.Event.
message Event {
  string id = 1;
  google.protobuf.Timestamp ts = 2;
  string type = 3; // open enum (telemetry.EventType)
  string layer = 4; // open enum (telemetry.HealthLayer)
  string severity = 5; // open enum (telemetry.Severity)
  string message = 6;
  map<string, string> attrs = 7;
}

// InventoryItem mirrors telemetry.InventoryItem (device-only). Fields 9-13
// (the former interface delta: name, addrs, gateway, dns, up) were removed when
// interface state moved to the authoritative InterfaceSnapshot and are reserved
// so the numbers/names can never be silently reused.
message InventoryItem {
  reserved 9 to 13;
  reserved "name", "addrs", "gateway", "dns", "up";
  string kind = 1; // open enum (telemetry.InventoryKind)
  string op = 2; // open enum (telemetry.DeltaOp)
  string id = 3;
  // device fields
  string mac = 4;
  string ip = 5;
  string hostname = 6;
  string vendor = 7;
  google.protobuf.Timestamp last_seen = 8;
}

// InterfaceSnapshot mirrors telemetry.InterfaceSnapshot — the authoritative full
// set of the agent's network interfaces for one collection round plus the
// collection-level Wi-Fi verdict.
message InterfaceSnapshot {
  google.protobuf.Timestamp sampled_at = 1;
  string wifi_state = 2; // open enum (telemetry.WiFiCollectionState)
  string wifi_reason = 3; // open enum (telemetry.WiFiReason)
  repeated InterfaceState interfaces = 4;
}

// InterfaceState mirrors telemetry.InterfaceState — one interface row. wifi is
// absent (nil) on wired rows.
message InterfaceState {
  string name = 1;
  repeated string addrs = 2;
  string gateway = 3;
  repeated string dns = 4;
  bool up = 5;
  bool is_wireless = 6;
  WiFiInfo wifi = 7;
}

// WiFiInfo mirrors telemetry.WiFiInfo — one wireless adapter's current status.
message WiFiInfo {
  string state = 1; // open enum (telemetry.WiFiLinkState)
  string reason = 2; // open enum (telemetry.WiFiReason)
  string ssid = 3;
  string band = 4; // open enum (telemetry.WiFiBand)
  int32 channel = 5;
}

// HostSnapshot mirrors telemetry.HostSnapshot (ephemeral, on-demand). Fields
// use proto3 presence so a scope-denied field stays absent, matching the Go
// pointer structs. Scopes carries one result per requested scope.
message HostSnapshot {
  google.protobuf.Timestamp ts = 1;
  string request_id = 2;
  optional int32 process_total = 3;
  repeated ProcessInfo processes = 4;
  repeated ConnectionInfo connections = 5;
  repeated SnapshotScopeResult scopes = 6;
}

// SnapshotScopeResult mirrors telemetry.SnapshotScopeResult.
message SnapshotScopeResult {
  string scope = 1;
  string status = 2; // collected | denied | unsupported | failed
  string reason = 3;
}

// ProcessInfo mirrors telemetry.ProcessInfo. Basic fields (pid/name/status) are
// always present when a row exists; the rest use presence per scope.
message ProcessInfo {
  int32 pid = 1;
  string name = 2;
  string status = 4;
  optional string user = 3;
  optional double cpu_pct = 5;
  optional uint64 rss_bytes = 6;
  optional uint64 virt_bytes = 7;
  optional uint64 disk_read_bytes = 8;
  optional uint64 disk_write_bytes = 9;
  optional double run_time_seconds = 10;
}

// ConnectionInfo mirrors telemetry.ConnectionInfo. Summary fields (proto/state)
// are always present when a row exists; the rest use presence per scope.
message ConnectionInfo {
  string proto = 1;
  string state = 4;
  optional string local_addr = 2;
  optional string remote_addr = 3;
  optional int32 pid = 5;
  optional string process_name = 6;
}

// TelemetryAck is the server -> agent acknowledgment for one Packet frame:
// the durable-sequence watermark plus the server clock. Fields 3-4
// (config_version, desired_state) were removed when DesiredState became its
// own push frame and are reserved.
message TelemetryAck {
  reserved 3, 4;
  reserved "config_version", "desired_state";
  uint64 highest_sequence = 1;
  google.protobuf.Timestamp server_time = 2;
}

// DesiredState mirrors config.DesiredState (the config downlink, pushed as a
// standalone frame on connect and on every config change). Field 4
// (snapshot_request) was removed when SnapshotRequest became its own push
// frame and is reserved.
message DesiredState {
  reserved 4;
  reserved "snapshot_request";
  int32 config_version = 1;
  repeated ProbeTarget probe_targets = 2;
  Intervals intervals = 3;
  // The egress proxies referenced by probe_targets — only those referenced, and
  // only those still enabled. A target whose proxy_id has no entry here stays in
  // probe_targets on purpose, so the agent reports proxy-missing rather than the
  // monitor silently disappearing.
  repeated ProxySpec proxies = 5;
}

// SnapshotRequest mirrors config.SnapshotRequest. Fields 2-3 (want_processes,
// want_connections) were removed when snapshots became scope-based and are
// reserved.
message SnapshotRequest {
  reserved 2, 3;
  reserved "want_processes", "want_connections";
  string request_id = 1;
  repeated string scopes = 4;
}

// ProbeTarget mirrors config.ProbeTarget. Field 3 (tier) was removed and is
// reserved so the number/name can never be silently reused by a future field.
message ProbeTarget {
  reserved 3;
  reserved "tier";
  string kind = 1;
  string target = 2;
  ProbeParams params = 4;
  string name = 5;
  // Stable server-side id of this monitor (probe_tasks.id). The agent stamps it
  // onto every Metric the probe emits so the server can key series per monitor.
  string monitor_id = 6;
  // The target's material config generation (probe_tasks.config_serial) at push.
  // The agent echoes it on Metric.config_serial and MonitorStatusEntry
  // .target_config_serial so the server can reject obsolete-generation samples.
  int32 config_serial = 7;
  // Pins this target's egress to one DesiredState.proxies entry. Empty = direct.
  // An id the agent cannot honor makes the monitor un-runnable, never direct.
  string proxy_id = 8;
}

// ProxySpec mirrors config.ProxySpec — one egress proxy for monitoring targets.
// socks5/http are relays (CONNECT); wireguard is a userspace tunnel the agent
// dials from inside, which is why it is the only type that can carry ICMP/UDP
// probes. Credential fields are secrets: they ride the authenticated agent
// channel and are never echoed by the server's read APIs.
message ProxySpec {
  string id = 1;
  string name = 2;
  string type = 3; // open enum (config.ProxyType*)
  // This proxy's material config generation. The agent keys its built dialer on
  // (id, config_serial) so an edit tears the old one down instead of living on
  // with stale credentials or a stale connection.
  int32 config_serial = 4;

  // socks5 / http
  string host = 5;
  int32 port = 6;
  string username = 7;
  string password = 8;
  string dns_mode = 9; // open enum (config.ProxyDNS*); "" = local
  int32 connect_timeout_ms = 10;

  // wireguard
  string wg_private_key = 11;
  string wg_peer_public_key = 12;
  string wg_preshared_key = 13;
  string wg_endpoint = 14;
  string wg_allowed_ips = 15;
  string wg_local_addrs = 16;
  string wg_dns = 17;
  int32 wg_mtu = 18;
  int32 wg_keepalive_seconds = 19;
}

// ProbeParams mirrors config.ProbeParams (zero == collector default).
message ProbeParams {
  int32 interval_seconds = 1;
  int32 timeout_ms = 2;
  int32 packet_size = 3;
  int32 retries = 4;
  string record_type = 5;
  string method = 6;
  int32 expected_status = 7;
  // Appended fields (never renumber the above).
  string keyword = 8;
  bool keyword_invert = 9;
  string accepted_statuses = 10;
  map<string, string> headers = 11;
  string body = 12;
  int32 max_redirects = 13;
  bool ignore_tls = 14;
  int32 max_response_bytes = 15;
  int32 port = 16;
  bool tls = 17;
  int32 packet_count = 18;
  int32 global_timeout_ms = 19;
  string resolver_server = 20;
  int32 resolver_port = 21;
  string resolver_protocol = 22;
  string nat_transport = 23;
  string stun_server2 = 24;
  string interface = 25;
}

// Intervals mirrors config.Intervals.
message Intervals {
  int32 base_seconds = 1;
  int32 regular_seconds = 2;
}

// IncidentSnapshotRequest mirrors config.IncidentSnapshotRequest — the one-shot
// server->agent ask for an immutable incident scene snapshot (INCIDENT-002).
message IncidentSnapshotRequest {
  string request_id = 1;
  string incident_id = 2;
  // The absolute deadline this carried was minted on the server clock and read on
  // the agent's, so clock skew came straight out of the collection window; it was
  // replaced by budget_ms and is reserved so the number/name can never be
  // silently reused.
  reserved 3;
  reserved "deadline";
  repeated SnapshotTargetRef targets = 4;
  // Collection budget measured from arrival on the agent's own clock, never an
  // absolute timestamp — agent/server clock skew must not shrink the window.
  int32 budget_ms = 5;
}

// SnapshotTargetRef mirrors config.SnapshotTargetRef.
message SnapshotTargetRef {
  string monitor_id = 1;
  string kind = 2;
  string target = 3;
  int32 port = 4;
}

// TraceRequest mirrors config.TraceRequest — the one-shot server->agent ask to
// run a single incident traceroute (DIAG-001).
message TraceRequest {
  string report_id = 1;
  string mode = 2; // icmp | tcp
  string destination_host = 3;
  int32 tcp_port = 4;
  int32 max_hops = 5;
  int32 attempts_per_hop = 6;
  int32 total_timeout_ms = 7;
  bool resolve_hop_hostnames = 8;
  // Replaced by budget_ms for the same clock-skew reason as
  // IncidentSnapshotRequest, and reserved so the number/name can never be
  // silently reused.
  reserved 9;
  reserved "deadline";
  // Request validity window measured from arrival on the agent's own clock.
  int32 budget_ms = 10;
}

// IncidentSnapshot mirrors telemetry.IncidentSnapshot — the agent's allowlisted
// incident-scene evidence. Field groups carry only non-sensitive network/agent/
// resource/target context; typed payloads are set only when their group
// collected.
message IncidentSnapshot {
  string request_id = 1;
  string incident_id = 2;
  google.protobuf.Timestamp collected_at = 3;
  repeated SnapshotGroupResult groups = 4;
  SnapshotNetwork network = 5;
  SnapshotAgentInfo agent = 6;
  SnapshotResources resources = 7;
  repeated SnapshotTargetResult targets = 8;
}

// SnapshotGroupResult mirrors telemetry.SnapshotGroupResult.
message SnapshotGroupResult {
  string group = 1;
  string status = 2; // collected | denied | unsupported | failed
  string reason = 3;
  google.protobuf.Timestamp collected_at = 4;
}

// SnapshotNetwork mirrors telemetry.SnapshotNetwork.
message SnapshotNetwork {
  repeated SnapshotInterface interfaces = 1;
  SnapshotRoute default_route = 2;
  repeated string dns_servers = 3;
}

// SnapshotInterface mirrors telemetry.SnapshotInterface.
message SnapshotInterface {
  string name = 1;
  repeated string addrs = 2;
  bool up = 3;
  bool is_wireless = 4;
}

// SnapshotRoute mirrors telemetry.SnapshotRoute.
message SnapshotRoute {
  string gateway = 1;
  string interface = 2;
}

// SnapshotAgentInfo mirrors telemetry.SnapshotAgentInfo.
message SnapshotAgentInfo {
  string agent_id = 1;
  string hostname = 2;
  string platform = 3;
  string agent_version = 4;
}

// SnapshotResources mirrors telemetry.SnapshotResources. Pointers use presence
// so an unreadable value stays absent rather than a misleading zero.
message SnapshotResources {
  optional double cpu_percent = 1;
  optional uint64 memory_total_bytes = 2;
  optional uint64 memory_used_bytes = 3;
}

// SnapshotTargetResult mirrors telemetry.SnapshotTargetResult.
message SnapshotTargetResult {
  string monitor_id = 1;
  string kind = 2;
  string target = 3;
  repeated string resolved_ips = 4;
  repeated string endpoints = 5;
  string error_class = 6;
}

// TraceResult mirrors telemetry.TraceResult — the agent's terminal traceroute
// result. Intermediate `*` attempts never imply a broken path; only a
// destination responder sets reached.
message TraceResult {
  string report_id = 1;
  string mode = 2;
  string status = 3; // succeeded | partial | timed_out | unsupported | failed | canceled
  string reason = 4;
  string destination_ip = 5;
  bool reached = 6;
  int32 reached_ttl = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  repeated TraceHop hops = 10;
}

// TraceHop mirrors telemetry.TraceHop.
message TraceHop {
  int32 ttl = 1;
  repeated TraceAttempt attempts = 2;
}

// TraceAttempt mirrors telemetry.TraceAttempt. timeout marks a `*` attempt with
// the other fields empty.
message TraceAttempt {
  string responder_addr = 1;
  string hostname = 2;
  double rtt_ms = 3;
  bool timeout = 4;
}
